[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-the-resume-builder"
version = "0.2.0"
description = "Tailor a LaTeX resume to a job description without inventing anything."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "pypdf>=4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bob = "bob.cli:main"

[tool.setuptools.packages.find]
include = ["bob*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
